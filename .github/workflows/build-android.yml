name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set version
        id: version
        run: |
          BUILD=${{ github.run_number }}
          VERSION="1.0.${BUILD}"
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=peakwise-${VERSION}.apk" >> $GITHUB_OUTPUT
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.version = '${VERSION}';
            cfg.expo.android.versionCode = ${BUILD};
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "
          echo "export const APP_VERSION = '${VERSION}';" > src/constants/version.ts

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Cache android/ keyed by native deps.
      # Cache hit  → prebuild without --clean → preserves .cxx/ NDK objects → no C++ recompile
      # Cache miss → prebuild --clean → full rebuild → saves android/ for next run
      - name: Restore android cache
        id: android-cache
        uses: actions/cache@v4
        with:
          path: android/
          key: android-${{ hashFiles('package-lock.json') }}

      - name: Expo prebuild
        run: |
          if [ "${{ steps.android-cache.outputs.cache-hit }}" = "true" ]; then
            npx expo prebuild --platform android
          else
            npx expo prebuild --platform android --clean
          fi
        env:
          EXPO_NO_DOTENV: 1

      # arm64-v8a only:
      #   APK size:         250 MB → ~80 MB  (llama.rn ships 4 ABI .so files)
      #   NDK compile time: -75%             (only 1 of 4 ABIs compiled)
      - name: Apply arm64-v8a ABI filter
        run: |
          echo 'android { defaultConfig { ndk { abiFilters "arm64-v8a" } } }' \
            >> android/app/build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --build-cache

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Peakwise ${{ steps.version.outputs.version }}"
          body: |
            ## Скачать APK

            👇 **Нажми на файл ниже чтобы скачать APK**

            > Установка: разреши установку из неизвестных источников в настройках Android

            ---
            Собрано из коммита ${{ github.sha }}
          files: android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
          make_latest: true
