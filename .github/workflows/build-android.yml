name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # cache: 'gradle' caches ~/.gradle/caches and ~/.gradle/wrapper automatically
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_DOTENV: 1
          # ubuntu-latest already has Android SDK at this path
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --build-cache
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Get version from app.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          BUILD_NUM=${{ github.run_number }}
          echo "version=v${VERSION}-build${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "apk_name=peakwise-${VERSION}-build${BUILD_NUM}.apk" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Peakwise ${{ steps.version.outputs.version }}"
          body: |
            ## Скачать APK

            👇 **Нажми на файл ниже чтобы скачать APK**

            > Установка: разреши установку из неизвестных источников в настройках Android

            ---
            Собрано из коммита ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}
          make_latest: true
