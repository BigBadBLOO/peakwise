name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set version 1.0.<build_number>
        id: version
        run: |
          BUILD=${{ github.run_number }}
          VERSION="1.0.${BUILD}"
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=peakwise-${VERSION}.apk" >> $GITHUB_OUTPUT
          # Patch app.json
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.version = '${VERSION}';
            cfg.expo.android.versionCode = ${BUILD};
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "
          # Patch src/constants/version.ts
          echo "export const APP_VERSION = '${VERSION}';" > src/constants/version.ts
          echo "Version set to ${VERSION}"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_DOTENV: 1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --build-cache

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Peakwise ${{ steps.version.outputs.version }}"
          body: |
            ## Скачать APK

            👇 **Нажми на файл ниже чтобы скачать APK**

            > Установка: разреши установку из неизвестных источников в настройках Android

            ---
            Собрано из коммита ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}
          make_latest: true
